<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0B3557"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Radar Higiexpo 2026</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: app shell — sticky brand bar, one scrolling view, fixed bottom tab bar; visit form opens as a full-screen sheet */
:root{
  --bg:#EEF2F6; --surface:#FFFFFF; --surface2:#F6F8FB; --ink:#0E1E2C; --muted:#5A6B7B; --line:#D6E0E9;
  --navy:#0B3557; --blue:#0A86CC; --blue-soft:#E2F1FB; --on-navy:#FFFFFF;
  --ok:#1C8A57; --ok-soft:#E1F3EA; --warn:#B57A00; --warn-soft:#FBF0D6; --bad:#B23A3A; --bad-soft:#F8E3E3;
  --idle:#8A99A8;
  --f-display:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"Roboto Mono",monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B141D; --surface:#132130; --surface2:#182939; --ink:#E5EDF4; --muted:#92A3B3; --line:#263B4E;
  --navy:#0E2B45; --blue:#4DB2EE; --blue-soft:#15344B; --on-navy:#FFFFFF;
  --ok:#4CC88B; --ok-soft:#163A2A; --warn:#E5B04A; --warn-soft:#3A2F14; --bad:#F07C7C; --bad-soft:#3E1E22; --idle:#6F8396;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B141D; --surface:#132130; --surface2:#182939; --ink:#E5EDF4; --muted:#92A3B3; --line:#263B4E;
  --navy:#0E2B45; --blue:#4DB2EE; --blue-soft:#15344B; --on-navy:#FFFFFF;
  --ok:#4CC88B; --ok-soft:#163A2A; --warn:#E5B04A; --warn-soft:#3A2F14; --bad:#F07C7C; --bad-soft:#3E1E22; --idle:#6F8396;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--navy)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--navy);color:var(--on-navy)}
.top-in{display:flex;align-items:center;gap:10px;padding-block:10px;max-width:760px;margin:0 auto}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.plate{background:#fff;border-radius:8px;padding:4px 7px;display:flex;align-items:center;gap:6px}
.plate img{height:18px;width:auto;display:block}
@media (max-width:430px){.plate .sep,.plate img+.sep+img{display:none}}
.plate .sep{width:1px;height:16px;background:#C9D4DE}
.top h1{font-family:var(--f-display);font-size:15px;font-weight:700;margin:0;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top small{display:block;font-size:11px;opacity:.75;font-weight:500;letter-spacing:.04em;text-transform:uppercase}
.sync{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;background:rgba(255,255,255,.1);border:0;border-radius:999px;padding:6px 10px;color:#fff;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:#9FB3C5;flex:none}
.dot.ok{background:#5BD69A}.dot.warn{background:#F2C14E}.dot.bad{background:#FF8A8A}
.banner{background:var(--bad-soft);color:var(--bad);font-size:14px;padding-block:10px;font-weight:600}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner-in{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:center;justify-content:space-between}

main{max-width:760px;margin:0 auto;padding-block:14px 110px}
.view{display:flex;flex-direction:column;gap:14px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{display:grid;grid-template-columns:repeat(4,1fr);max-width:760px;margin:0 auto;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav button{background:none;border:0;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted);min-height:58px}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="true"]{color:var(--blue)}

/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:14px}
.h2{font-family:var(--f-display);font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:4px 0 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:10px 14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#06121C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#06121C}}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.block{width:100%}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px}
.btn[disabled]{opacity:.5}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:7px 14px;font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;min-height:42px;font-weight:600;font-size:14px;color:var(--muted);padding:6px 4px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button.st-andamento[aria-pressed="true"]{background:var(--warn-soft);color:var(--warn)}
.seg button.st-concluido[aria-pressed="true"]{background:var(--ok-soft);color:var(--ok)}

/* fields */
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f>label,.lbl{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.f input,.f select,.f textarea,.inp{width:100%;min-height:48px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);padding:11px 12px;font-size:16px}
.f textarea{min-height:84px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus,.inp:focus{outline:2px solid var(--blue);outline-offset:0;background:var(--surface)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media (max-width:420px){.grid2.wrap{grid-template-columns:1fr}}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.sec{display:flex;flex-direction:column;gap:12px}
.sec-t{font-family:var(--f-display);font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px;margin:6px 0 0}
.sec-t::after{content:"";flex:1;height:1px;background:var(--line)}
.hint{font-size:13px;color:var(--muted)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:2px 7px;font-size:12px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.pr5{background:var(--navy);color:#fff}
.pr4{background:var(--blue);color:#fff}
:root[data-theme="dark"] .pr4{color:#06121C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pr4{color:#06121C}}
.pr3{border:1.5px solid var(--blue);color:var(--blue)}
.pr2,.pr1,.pr0{border:1px solid var(--line);color:var(--muted)}
.stand{font-family:var(--f-mono);font-weight:600;font-size:13px;background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.flag{background:var(--warn-soft);color:var(--warn)}

/* route list */
.toolbar{display:flex;flex-direction:column;gap:10px}
.search{position:relative}
.search input{padding-left:40px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.scrollx{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.scrollx::-webkit-scrollbar{display:none}
.scrollx .chip{flex:none}
.leg{padding:10px 2px 4px;display:flex;align-items:baseline;gap:4px 8px;flex-wrap:wrap}
.leg b{white-space:nowrap}
.leg b{font-family:var(--f-display);font-size:14px}
.leg span{font-size:12px;color:var(--muted)}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.it{border-top:1px solid var(--line)}
.it:first-child{border-top:0}
.it-h{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:12px 12px;min-height:64px}
.ord{font-family:var(--f-mono);font-size:13px;color:var(--muted);text-align:center}
.it-n{font-weight:700;font-size:16px;line-height:1.2;overflow-wrap:anywhere}
.it-m{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:5px;font-size:12px;color:var(--muted)}
.st{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--idle);color:var(--idle);flex:none}
.st svg{width:16px;height:16px}
.st.andamento{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.st.concluido{border-color:var(--ok);background:var(--ok);color:#fff}
.it-x{padding:0 12px 14px 56px;display:flex;flex-direction:column;gap:10px}
.inv{font-size:14px;background:var(--surface2);border-radius:10px;padding:10px 12px}
.inv b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:2px}
.alert{font-size:14px;background:var(--warn-soft);color:var(--ink);border-radius:10px;padding:10px 12px;overflow-wrap:anywhere}
.alert b{color:var(--warn)}
.alert a{color:var(--blue)}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.kpi .v{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .l{font-size:13px;color:var(--muted);font-weight:600;margin-top:2px}
.kpi .s{font-size:12px;color:var(--muted);margin-top:4px}
.hero{background:var(--navy);color:#fff;border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.hero .big{font-family:var(--f-display);font-weight:800;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .b-ok{background:#5BD69A}.bar .b-w{background:#F2C14E}
.lbar{height:8px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);overflow:hidden;display:flex}
.lbar i{display:block;height:100%}
.lbar .b-ok{background:var(--ok)}.lbar .b-w{background:var(--warn)}
.prow{display:grid;grid-template-columns:70px 1fr 64px;gap:10px;align-items:center;font-size:14px}
.feed{display:flex;flex-direction:column}
.feed-i{padding:11px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:3px;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%}
.feed-i:first-child{border-top:0}
.feed-i .t{font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.tag.op{color:var(--ok)}.tag.am{color:var(--bad)}.tag.la{color:var(--blue)}
.empty{padding:18px 14px;color:var(--muted);font-size:14px}

/* map */
.mapwrap{position:relative;overflow:auto;height:calc(100vh - 250px);min-height:340px;border-radius:var(--r);border:1px solid var(--line);background:#fff;touch-action:pan-x pan-y}
.mapwrap.full{height:calc(100% - 64px)}
.mapin{position:relative;transform-origin:0 0}
.mapin img{display:block;max-width:none;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.mk{position:absolute;transform:translate(-50%,-50%);width:16px;height:16px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45);padding:0}
.mk.p5{background:#0B3557}.mk.p4{background:#0A86CC}.mk.p3{background:#6FB7E0}.mk.plo{background:#9AA7B4;width:11px;height:11px;border-width:2px}
.mk.andamento{background:#E0A11B}.mk.concluido{background:#1C8A57}
.mk.base{background:#E2403A;width:20px;height:20px}
.mk.focus{outline:4px solid #E2403A;outline-offset:3px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{outline-offset:8px}}
@media (prefers-reduced-motion:reduce){.mk.focus{animation:none}}
.maptools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.pop{position:absolute;z-index:3;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;box-shadow:0 4px 18px rgba(0,0,0,.25);width:220px;font-size:14px;display:flex;flex-direction:column;gap:8px}

/* sheet (visit) */
.sheet{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sh-top{background:var(--navy);color:#fff}
.sh-top-in{max-width:760px;margin:0 auto;padding-block:8px 10px;display:flex;flex-direction:column;gap:8px}
.sh-r1{display:flex;align-items:center;gap:8px}
.iconbtn{width:44px;height:44px;border-radius:10px;border:0;background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center;flex:none;text-decoration:none}
.iconbtn svg{width:22px;height:22px}
.sh-title{min-width:0;flex:1}
.sh-title b{display:block;font-family:var(--f-display);font-size:18px;font-weight:800;line-height:1.15;overflow-wrap:anywhere}
.sh-title span{font-size:13px;opacity:.85}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;border:0;background:rgba(255,255,255,.08);color:#D5E2EE;border-radius:9px;min-height:40px;padding:6px 12px;font-weight:700;font-size:14px}
.tabs button[aria-pressed="true"]{background:#fff;color:#0B3557}
.sh-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sh-body-in{max-width:760px;margin:0 auto;padding-block:14px 24px;display:flex;flex-direction:column;gap:14px}
.sh-foot{background:var(--surface);border-top:1px solid var(--line)}
.sh-foot-in{max-width:760px;margin:0 auto;padding-block:8px}
.saved{font-size:12px;color:var(--muted);text-align:center;margin-top:6px;min-height:16px}

.pcard{display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.pcard b{font-size:16px;overflow-wrap:anywhere}
.price{font-family:var(--f-mono);font-weight:600}
.calc{font-family:var(--f-mono);font-size:15px;background:var(--blue-soft);color:var(--ink);border-radius:10px;padding:10px 12px}
.ev{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:start}
.ev .th{width:72px;height:72px;border-radius:8px;background:var(--surface2);border:1px solid var(--line);object-fit:cover;display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;text-align:center}
.confirm{border:1.5px solid var(--bad);background:var(--bad-soft);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;font-size:14px}

.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:#0E1E2C;color:#fff;padding:12px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.3);max-width:calc(100% - 32px);text-align:center}
.toast.err{background:#9C2C2C}
.howto ol{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.howto p{margin:0;font-size:15px}
details.card summary{padding:14px;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.card summary::-webkit-details-marker{display:none}
details.card[open] summary{border-bottom:1px solid var(--line)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
table.dict{border-collapse:collapse;font-size:13px;width:100%}
table.dict td,table.dict th{border-top:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.tw{overflow-x:auto}
</style>

];
(function buildRoute(){
  let n = 0;
  PASSES.forEach((ps, pi) => {
    const list = COMPS.filter(c => ps.cols.includes(c.s[0]));
    list.sort((a,b) => ps.dir === "up" ? (b.y - a.y) || (a.x - b.x) : (a.y - b.y) || (a.x - b.x));
    list.forEach(c => { c.pass = pi; c.ord = ++n; c.av = ps.av; });
  });
})();

/* ---------- storage layer: IndexedDB → localStorage → memory ---------- */
const Store = {
  mode: "memory", db: null,
  async init(){
    try {
      this.db = await new Promise((res, rej) => {
        const rq = indexedDB.open(APP, 1);
        rq.onupgradeneeded = () => { const d = rq.result; ["bundles","photos","meta"].forEach(n => { if (!d.objectStoreNames.contains(n)) d.createObjectStore(n, {keyPath:"id"}); }); };
        rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error); rq.onblocked = () => rej(new Error("blocked"));
        setTimeout(() => rej(new Error("timeout")), 4000);
      });
      this.mode = "idb";
    } catch(e) {
      try { localStorage.setItem("__t","1"); localStorage.removeItem("__t"); this.mode = "ls"; } catch(e2) { this.mode = "memory"; }
    }
    try { if (navigator.storage && navigator.storage.persist) { this.persisted = await navigator.storage.persisted(); if (!this.persisted) this.persisted = await navigator.storage.persist(); } } catch(e) {}
  },
  tx(store, mode, fn){ return new Promise((res, rej) => { const t = this.db.transaction(store, mode); const s = t.objectStore(store); let out; const r = fn(s); if (r) r.onsuccess = () => { out = r.result; }; t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }); },
  async all(store){
    if (this.mode === "idb") return (await this.tx(store, "readonly", s => s.getAll())) || [];
    if (this.mode === "ls") { try { return JSON.parse(localStorage.getItem(APP + ":" + store) || "[]"); } catch(e) { return []; } }
    return [];
  },
  async put(store, obj){
    if (this.mode === "idb") return this.tx(store, "readwrite", s => s.put(obj));
    if (this.mode === "ls") {
      if (store === "photos") throw new Error("Fotos exigem IndexedDB");
      const arr = await this.all(store); const i = arr.findIndex(x => x.id === obj.id); if (i >= 0) arr[i] = obj; else arr.push(obj);
      localStorage.setItem(APP + ":" + store, JSON.stringify(arr));
    }
  },
  async del(store, id){
    if (this.mode === "idb") return this.tx(store, "readwrite", s => s.delete(id));
    if (this.mode === "ls") { const arr = (await this.all(store)).filter(x => x.id !== id); localStorage.setItem(APP + ":" + store, JSON.stringify(arr)); }
  },
  async get(store, id){
    if (this.mode === "idb") return this.tx(store, "readonly", s => s.get(id));
    return (await this.all(store)).find(x => x.id === id);
  },
  async clear(store){
    if (this.mode === "idb") return this.tx(store, "readwrite", s => s.clear());
    if (this.mode === "ls") localStorage.removeItem(APP + ":" + store);
  }
};

const pending = new Map();
let saveTimer = null;
function touch(cid, opts = {}){
  const b = B(cid);
  if (!opts.noAuto && b.status === "nao") { b.status = "andamento"; if (!b.startedAt) b.startedAt = nowISO(); refreshStatusUI(); }
  b.updatedAt = nowISO();
  pending.set(cid, b);
  S.meta.dirty[cid] = 1;
  clearTimeout(saveTimer); saveTimer = setTimeout(flush, 350);
  setSaved("Salvando…");
}
async function flush(){
  clearTimeout(saveTimer);
  if (!pending.size) return;
  const items = [...pending.values()]; pending.clear();
  try {
    for (const b of items) await Store.put("bundles", JSON.parse(JSON.stringify(b)));

/* ---------- cloud backup via artifact db (private per user) ---------- */
const Cloud = {db:null, uid:null, state:"off", busy:false, timer:null, err:null};
async function cloudInit(){
  if (!window.claude || !window.claude.use) { Cloud.state = "off"; renderSync(); return; }
  try {
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) { Cloud.state = "off"; renderSync(); return; }
    const id = await user.id();
    if (!id) { Cloud.state = "off"; renderSync(); return; }
    Cloud.db = db; Cloud.uid = id; Cloud.state = "idle";
    await cloudPull();
    scheduleCloud(500);
  } catch(e) { Cloud.state = "err"; Cloud.err = e; renderSync(); }
}
const cloudCol = () => Cloud.db.collection("data/users/" + Cloud.uid);
async function cloudPull(){
  try {
    const snap = await cloudCol().get();
    let n = 0;
    snap.docs.forEach(d => {
      const x = d.data(); if (!x || !x.bundle) return;
      const cb = JSON.parse(x.bundle);
      const lb = S.bundles[cb.id];
      if (!lb || !lb.updatedAt || (cb.updatedAt && cb.updatedAt > lb.updatedAt)) { S.bundles[cb.id] = cb; pending.set(cb.id, cb); n++; }
    });
    if (n) { await flush(); Object.keys(S.meta.dirty).forEach(k => { if (pending.has(k)) delete S.meta.dirty[k]; }); toast(n + " ficha(s) restaurada(s) da cópia na nuvem"); render(); }
    Cloud.state = "ok"; Cloud.err = null;
  } catch(e) { Cloud.state = "err"; Cloud.err = e; }
  renderSync();
}
function scheduleCloud(ms = 2500){ if (!Cloud.db) return; clearTimeout(Cloud.timer); Cloud.timer = setTimeout(cloudPush, ms); }
async function cloudPush(){
  if (!Cloud.db || Cloud.busy) return;
  const ids = Object.keys(S.meta.dirty);
  if (!ids.length) { if (Cloud.state !== "err") Cloud.state = "ok"; renderSync(); return; }
  if (navigator.onLine === false) { Cloud.state = "offline"; renderSync(); scheduleCloud(15000); return; }
  Cloud.busy = true; Cloud.state = "sync"; renderSync();
  try {
    for (const id of ids) {
      const b = S.bundles[id]; if (!b) { delete S.meta.dirty[id]; continue; }
      const stamp = b.updatedAt;
      await cloudCol().doc("b-" + id).set({bundle: JSON.stringify(b), updatedAt: stamp, app: APP, v: VERSION});
      if (S.bundles[id].updatedAt === stamp) delete S.meta.dirty[id];
    }
    S.meta.lastCloud = nowISO(); await saveMeta();
    Cloud.state = "ok"; Cloud.err = null;
  } catch(e) {
    Cloud.state = (navigator.onLine === false) ? "offline" : "err"; Cloud.err = e;
    scheduleCloud(20000);
  }
  Cloud.busy = false; renderSync();
}
addEventListener("online", () => scheduleCloud(800));
addEventListener("offline", () => { if (Cloud.db) { Cloud.state = "offline"; renderSync(); } });

/* ---------- photos ---------- */
async function compressImage(file){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const max = 1600, sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const cv = document.createElement("canvas"); cv.width = Math.round(img.naturalWidth * sc); cv.height = Math.round(img.naturalHeight * sc);
    cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
    return await new Promise(res => cv.toBlob(b => res(b || file), "image/jpeg", 0.75));
  } catch(e) { return file; } finally { URL.revokeObjectURL(url); }
}
async function photoURL(pid){
  if (S.photoCache[pid]) return S.photoCache[pid];
  try { const p = await Store.get("photos", pid); if (p && p.blob) return (S.photoCache[pid] = URL.createObjectURL(p.blob)); } catch(e) {}
  return null;
}
async function hydratePhotos(root){
  for (const el of root.querySelectorAll("[data-photo]")) {
    const u = await photoURL(el.dataset.photo);
    if (u) { const im = document.createElement("img"); im.className = "th"; im.alt = "Foto"; im.src = u; el.replaceWith(im); }
  }
}

      <button type="button" class="btn sm" data-csv="Precos">CSV Preços</button>
      <button type="button" class="btn sm" data-csv="Inteligencia">CSV Inteligência</button>
      <button type="button" class="btn sm" data-csv="Evidencias">CSV Evidências</button>

    <p class="hint">CSV com separador ponto e vírgula e vírgula decimal (padrão do Excel em português).</p>
  </div>
  <h2 class="h2">Backup e restauração</h2>
  <div class="card pad" style="display:flex;flex-direction:column;gap:10px">
    <button type="button" class="btn navy block" data-act="backupJSON">Backup completo (.json, com fotos)</button>
    <button type="button" class="btn block" data-act="backupLite">Backup leve (.json, sem fotos)</button>
    <button type="button" class="btn block" data-act="import">Restaurar backup (.json)</button>

  </div>
  <details class="card howto"><summary>Como usar no Android <span class="muted">▾</span></summary><div class="pad" style="display:flex;flex-direction:column;gap:10px">
    <ol>
      <li>Abra o link do Radar no <b>Chrome</b> do celular, ainda com internet (Wi-Fi do hotel ou 4G antes de entrar no pavilhão), e entre com sua conta Claude.</li>
      <li>No menu do Chrome (⋮), toque em <b>Adicionar à tela inicial</b> para abrir com um toque.</li>

      <li>Fluxo de visita: Roteiro → toque no estande → Abrir ficha → Visita, Produtos, Inteligência, Evidências → Concluído.</li>
    </ol>
  </div></details>
  <details class="card howto"><summary>Limites do armazenamento local <span class="muted">▾</span></summary><div class="pad" style="display:flex;flex-direction:column;gap:10px">
    <p>Os dados ficam no banco interno do navegador deste celular. Eles se perdem se você limpar os dados de navegação/site, usar aba anônima, desinstalar o navegador ou trocar de aparelho.</p>
    <p>Duas proteções: a cópia automática na nuvem (privada, ligada à sua conta, sem as fotos) e os backups .json, que você guarda onde quiser. As fotos só ficam no aparelho e no backup completo.</p>

  </div></details>
  <details class="card howto"><summary>Estrutura dos dados <span class="muted">▾</span></summary><div class="pad tw">${dictHTML()}</div></details>
  <details class="card howto"><summary>Critérios do roteiro <span class="muted">▾</span></summary><div class="pad" style="display:flex;flex-direction:column;gap:10px">
    <p><b>Prioridade</b> vem da coluna PONTUAÇÃO da planilha: 5 = P1, 4 = P2, 3 = P3 (os três formam a rota principal), 1–2 = P4 e 0 = sem pontuação (lista Outros).</p>
    <p><b>Percurso</b> em serpentina pelas avenidas, saindo do estande da Goedert (E200): AV. C ↑, AV. A ↓, AV. E ↑, AV. G ↓, AV. I ↑. Cada avenida cobre as duas colunas de estandes que a ladeiam. Use “Por prioridade” quando o tempo apertar.</p>
    <p><b>Estandes a validar</b>: GOEDERT (planilha C200, mapa E200) e IPEL (planilha D200, mapa C200). Os nomes de CNX Industry, Dadu Paper, Analítica Nova e Biochemical British aparecem diferentes no mapa; os estandes conferem.</p>
  </div></details>
  ${ui.confirm === "clear" ? clr : `<button type="button" class="btn danger block" data-act="clear">Apagar dados deste aparelho</button>`}`;
}
function dictHTML(){
  const T = [
    ["Concorrentes","concorrente_id","Cadastro vindo da planilha + mapa: estande, categoria, pontuação, prioridade, ordem no percurso."],
    ["Visitas","visita_id · concorrente_id","Uma linha por concorrente visitado: status, horários, contato, posicionamento de preço, observações."],
    ["Produtos","produto_id · concorrente_id","Um registro por produto observado, com categoria padronizada, lançamento e confiabilidade."],
    ["Precos","preco_id · produto_id","Preço separado do produto: status (confirmado/estimado/não coletado), unidade de venda, conteúdo e preço por unidade-base."],
    ["Inteligencia","intel_id · concorrente_id","Formato longo: uma linha por tema (diferenciais, oportunidades, ameaças…), pronto para filtro no Power BI."],
    ["Evidencias","evidencia_id · concorrente_id · produto_id","Fotos, catálogos, folders, cartões; nome do arquivo de foto no .zip."]
  ];
  return `<table class="dict"><thead><tr><th>Tabela</th><th>Chaves</th><th>Conteúdo</th></tr></thead><tbody>${T.map(r => `<tr><td><b>${r[0]}</b></td><td class="mono">${r[1]}</td><td>${r[2]}</td></tr>`).join("")}</tbody></table>`;
}

/* ---------- visit sheet ---------- */
function openVisit(cid, tab){
  ui.visit = cid; ui.vtab = tab || "visita"; ui.prod = null; ui.confirm = null;
  renderVisit();
}
function closeVisit(){ flush(); ui.visit = null; ui.prod = null; $("#sheet").innerHTML = ""; document.body.style.overflow = ""; render(); }
function renderVisit(){
  const c = BY_ID[ui.visit]; if (!c) return;
  const b = S.bundles[c.id] || blankBundle(c.id);
  document.body.style.overflow = "hidden";
  const tabs = [["visita","Visita"],["produtos",`Produtos${b.products.length ? " " + b.products.length : ""}`],["intel","Inteligência"],["evid",`Evidências${b.evidences.length ? " " + b.evidences.length : ""}`]];
  let body = "";
  if (ui.prod) body = prodForm(c, b);
  else if (ui.vtab === "visita") body = tabVisita(c, b);
  else if (ui.vtab === "produtos") body = tabProdutos(c, b);
  else if (ui.vtab === "intel") body = tabIntel(c, b);
  else body = tabEvid(c, b);
  $("#sheet").innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="Ficha ${esc(c.n)}">
    <div class="sh-top"><div class="sh-top-in gut">
      <div class="sh-r1">
        <button type="button" class="iconbtn" data-act="${ui.prod ? "prodBack" : "closeVisit"}" aria-label="Voltar">${ICON.back}</button>
        <div class="sh-title"><b>${esc(ui.prod ? (prodOf(b)?.name || "Novo produto") : c.n)}</b><span>${ui.prod ? esc(c.n) + " · " : ""}<span class="mono">${c.s}</span> · ${c.av} · ${PRIO(c.p).t} ${PRIO(c.p).d}</span></div>
        <button type="button" class="iconbtn" data-mapfocus="${c.id}" aria-label="Ver no mapa">${ICON.pin}</button>
        ${c.ig ? `<a class="iconbtn" href="${esc(c.ig)}" target="_blank" rel="noopener" aria-label="Instagram">${ICON.ig}</a>` : ""}
      </div>
      ${ui.prod ? "" : `<div class="tabs" role="group">${tabs.map(([k,t]) => `<button type="button" data-vtab="${k}" aria-pressed="${ui.vtab===k}">${t}</button>`).join("")}</div>`}
    </div></div>
    <div class="sh-body" id="shBody"><div class="sh-body-in gut">${body}</div></div>
    <div class="sh-foot"><div class="sh-foot-in gut">
      ${ui.prod ? `<div class="grid2"><button type="button" class="btn" data-act="prodBack">Pronto</button><button type="button" class="btn primary" data-act="prodNext">+ Outro produto</button></div>`
      : `<div class="seg" role="group" aria-label="Status da visita" id="stSeg">${Object.entries(STATUS).map(([k,t]) => `<button type="button" class="st-${k}" data-setst="${c.id}" data-val="${k}" aria-pressed="${b.status===k}">${t}</button>`).join("")}</div>`}
      <div class="saved" id="savedTxt">${b.updatedAt ? "Salvo às " + new Date(b.updatedAt).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}) : "Preenchimento salvo automaticamente"}</div>
    </div></div></div>`;
  hydratePhotos($("#sheet"));
}
function refreshStatusUI(){
  if (!ui.visit) return; const b = S.bundles[ui.visit]; if (!b) return;
  document.querySelectorAll("#stSeg [data-setst]").forEach(x => x.setAttribute("aria-pressed", x.dataset.val === b.status));
}
function tabVisita(c, b){

    </div>

      <div class="f"><label for="v-start">Início da visita</label><input id="v-start" type="datetime-local" data-b="v:startedAt" data-dt="1" value="${toLocalInput(b.startedAt)}"></div>

  <div class="sec">

function tabProdutos(c, b){
  const list = b.products.map(p => {
    const pr = p.price || {}; const pu = unitPrice(pr);
    const priceTxt = pr.status === "Confirmado" || pr.status === "Estimado" ? `<span class="price">${brl(pr.value)}</span> / ${esc(pr.saleUnit || "?")}${pu ? ` · <span class="price">${brl(pu)}</span>/${esc(pr.baseUnit)}` : ""} <span class="pill ${pr.status === "Confirmado" ? "pr4" : "pr3"}">${pr.status}</span>` : `<span class="muted">Preço não coletado</span>`;
    return `<button type="button" class="pcard" data-editp="${p.id}"><b>${esc(p.name || "Produto sem nome")}</b><span class="it-m">${p.category ? `<span>${esc(p.category)}</span>` : ""}${p.brand ? `<span>· ${esc(p.brand)}</span>` : ""}${p.launch && p.launch !== "Linha atual" ? `<span class="pill pr5">${esc(p.launch)}</span>` : ""}${p.conf ? `<span>· ${esc(p.conf)}</span>` : ""}</span><span class="small">${priceTxt}</span></button>`;
  }).join("");
  return `<button type="button" class="btn primary block" data-act="newProd">+ Novo produto</button>
    ${list || `<div class="card empty">Nenhum produto ainda. Cada produto guarda nome, categoria, especificações, preço e diferenciais; os dados da visita não precisam ser repetidos.</div>`}`;
}
const prodOf = b => b.products.find(p => p.id === ui.prod);
function unitPrice(pr){ if (!pr || pr.value == null || !pr.qty || !pr.baseUnit) return null; return pr.value / pr.qty; }
function prodForm(c, b){
  const p = prodOf(b); if (!p) return "";
  const pr = p.price || (p.price = {status:"Não coletado"});

  const pu = unitPrice(pr);
  const sel = (bind, opts, val, id) => `<select id="${id}" data-b="${bind}"><option value="">—</option>${opts.map(o => `<option${o === val ? " selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
  const comp = ui.confirm === "delProd" ? `<div class="confirm"><b>Excluir este produto?</b><div class="grid2"><button type="button" class="btn danger" data-act="delProdGo">Excluir</button><button type="button" class="btn" data-act="cancelConfirm">Cancelar</button></div></div>` : "";
  return `

    </div>
    <div class="grid3">
      <div class="f"><label for="p-brand">Marca</label><input id="p-brand" data-b="p:brand" value="${esc(p.brand)}"></div>
      <div class="f"><label for="p-line">Linha</label><input id="p-line" data-b="p:line" value="${esc(p.line)}"></div>
      <div class="f"><label for="p-sku">Código/SKU</label><input id="p-sku" data-b="p:sku" value="${esc(p.sku)}"></div>
    </div>
    <div class="f"><span class="lbl">Situação</span>${chips("p:launch", LAUNCH, p.launch)}</div>
    <div class="f"><label for="p-av">Disponibilidade / previsão de lançamento</label><input id="p-av" data-b="p:availability" value="${esc(p.availability)}" placeholder="Ex.: pronta entrega · previsão mar/2027"></div>
  </div>
  <div class="sec">
    <div class="sec-t">Preço e condições</div>
    <div class="f"><span class="lbl">Preço</span>${chips("pp:status", ["Não coletado","Confirmado","Estimado"], pr.status)}</div>
    ${hasP ? `
    <div class="grid2">
      <div class="f"><label for="pp-v">Preço (R$)</label><input id="pp-v" data-b="pp:value" data-num="1" inputmode="decimal" value="${pr.value != null ? String(pr.value).replace(".", ",") : ""}" placeholder="0,00"></div>
      <div class="f"><label for="pp-t">Tipo de preço</label>${sel("pp:type", PRICE_TYPES, pr.type, "pp-t")}</div>
    </div>
    <div class="grid3">
      <div class="f"><label for="pp-su">Vendido por</label>${sel("pp:saleUnit", SALE_UNITS, pr.saleUnit, "pp-su")}</div>
      <div class="f"><label for="pp-q">Conteúdo</label><input id="pp-q" data-b="pp:qty" data-num="1" inputmode="decimal" value="${pr.qty != null ? String(pr.qty).replace(".", ",") : ""}" placeholder="Ex.: 30"></div>

    <div class="calc" id="calcBox">${pu ? `= ${brl(pu)} por ${esc(pr.baseUnit)}` : "Informe conteúdo e unidade para calcular o preço por unidade-base (ex.: caixa 6 × 5 L = 30 L)."}</div>
    <div class="grid2 wrap">
      <div class="f"><label for="pp-c">Condições, descontos</label><input id="pp-c" data-b="pp:conditions" value="${esc(pr.conditions)}" placeholder="Ex.: 5% à vista, 28/56 dias"></div>
      <div class="f"><label for="pp-m">Pedido mínimo</label><input id="pp-m" data-b="pp:minOrder" value="${esc(pr.minOrder)}"></div>

}
function dataURLtoBlob(u){ const [h, d] = u.split(","); const mime = (h.match(/data:([^;]+)/) || [])[1] || "image/jpeg"; const bin = atob(d); const a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return new Blob([a], {type:mime}); }
const blobToDataURL = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); });
async function backup(withPhotos){
  await flush();
  const data = {app:APP, version:VERSION, exportedAt:nowISO(), bundles:Object.values(S.bundles), photos:[]};
  if (withPhotos && Store.mode === "idb") {
    const ph = await Store.all("photos");
    for (const p of ph) data.photos.push({id:p.id, compId:p.compId, at:p.at, dataUrl: await blobToDataURL(p.blob)});
  }
  const ok = await saveFile(`higiexpo2026_backup_${withPhotos ? "completo" : "leve"}_${stamp()}.json`, new Blob([JSON.stringify(data)], {type:"application/json"}));
  if (ok) { S.meta.lastBackup = nowISO(); await saveMeta(); toast(`Backup gerado: ${data.bundles.filter(hasData).length} fichas${withPhotos ? `, ${data.photos.length} fotos` : ""}`); render(); }
}
async function exportZIP(){
  if (!window.JSZip) { toast("Compactador não carregou. Use o backup completo.", true); return; }
  const zip = new JSZip(); const ph = await Store.all("photos"); const idx = {};
  Object.values(S.bundles).forEach(b => b.evidences.forEach((e, i) => { if (e.photoId) idx[e.photoId] = photoName(BY_ID[b.compId] || {s:"X", id:b.compId}, e, i); }));
  ph.forEach(p => zip.file(idx[p.id] || (p.id + ".jpg"), p.blob));
  const blob = await zip.generateAsync({type:"blob"});
  if (await saveFile(`higiexpo2026_fotos_${stamp()}.zip`, blob)) toast(ph.length + " foto(s) exportada(s)");
}
async function onImport(el){
  const f = el.files && el.files[0]; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (data.app !== APP || !Array.isArray(data.bundles)) throw new Error("Arquivo não é um backup deste Radar");
    let conflicts = 0, newer = 0;
    data.bundles.forEach(nb => { const lb = S.bundles[nb.id]; if (lb && hasData(lb)) { conflicts++; if ((lb.updatedAt || "") > (nb.updatedAt || "")) newer++; } });
    ui.importPreview = {data, n:data.bundles.filter(hasData).length, photos:(data.photos || []).length, conflicts, newer};
    ui.tab = "data"; render();
  } catch(e) { toast("Não foi possível ler o arquivo: " + e.message, true); }
}
async function doImport(mode){
  const {data} = ui.importPreview;
  try {
    if (mode === "replace") { await Store.clear("bundles"); await Store.clear("photos"); S.bundles = {}; }
    let n = 0;
    for (const nb of data.bundles) {
      const lb = S.bundles[nb.id];
      if (mode === "replace" || !lb || (nb.updatedAt || "") >= (lb.updatedAt || "")) { S.bundles[nb.id] = nb; await Store.put("bundles", nb); S.meta.dirty[nb.id] = 1; n++; }
    }
    let np = 0;
    if (Store.mode === "idb") for (const p of (data.photos || [])) { const exists = await Store.get("photos", p.id); if (!exists || mode === "replace") { const blob = dataURLtoBlob(p.dataUrl); await Store.put("photos", {id:p.id, compId:p.compId, at:p.at, blob, type:blob.type}); np++; } }
    await saveMeta(); ui.importPreview = null; render(); scheduleCloud();
    toast(`Restaurado: ${n} ficha(s), ${np} foto(s)`);
  } catch(e) { toast("Falha na restauração: " + e.message, true); }
}

/* ---------- boot ---------- */
(async function boot(){
  await Store.init();
  try {
    const all = await Store.all("bundles"); all.forEach(b => { S.bundles[b.id] = b; });
    const m = await Store.get("meta", "meta"); if (m) { S.meta = {...S.meta, ...m}; S.meta.dirty = m.dirty || {}; }
  } catch(e) { S.saveErr = e; }
  render();
  try { if (navigator.storage && navigator.storage.estimate) { const e = await navigator.storage.estimate(); S.usage = e; } } catch(e) {}
  cloudInit();
})();
setInterval(renderBanner, 5 * 60000);
</script>
